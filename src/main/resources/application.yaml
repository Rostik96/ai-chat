spring:
  application:
    name: ai-chat
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  main:
    allow-circular-references: true

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_MODEL:gemma3:4b-it-q4_K_M}
        temperature: ${SPRING_AI_OLLAMA_CHAT_TEMPERATURE:0.8}
        top-k: ${SPRING_AI_OLLAMA_CHAT_TOP_K:40}
        top-p: ${SPRING_AI_OLLAMA_CHAT_TOP_P:0.9}
        repeat-penalty: ${SPRING_AI_OLLAMA_CHAT_REPEAT_PENALTY:1.1}
        keep-alive: ${SPRING_AI_OLLAMA_CHAT_KEEP_ALIVE:5m}
        num-predict: ${SPRING_AI_OLLAMA_CHAT_NUM_PREDICT:2048}
        num-ctx: ${SPRING_AI_OLLAMA_CHAT_NUM_CTX:8192}
      embedding:
        options:
          model: mxbai-embed-large
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
  datasource:
    url:
    username:
    password:

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

chat:
  memory:
    max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}

rag:
  search:
    similarity-threshold: ${RAG_SEARCH_SIMILARITY_THRESHOLD:0.65}
    top-k: ${RAG_SEARCH_TOP_K:4}
  user-documents:
    retention: ${RAG_USER_DOCUMENTS_RETENTION:PT1H}
    cleanup-interval: ${RAG_USER_DOCUMENTS_CLEANUP_INTERVAL:PT15M}
